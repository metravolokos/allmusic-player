name: Desktop foundation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, edited]
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Ветка с кодом PR (например, ci/opt-001)"
        required: true
        default: main
        type: string
      windows_zip:
        description: "Собрать и сохранить Windows ZIP"
        required: false
        default: false
        type: boolean
      webdav_test_kit:
        description: "Собрать и сохранить WebDAV test kit"
        required: false
        default: false
        type: boolean
      full_tests:
        description: "Дополнительно выполнить Linux и Windows тесты Desktop"
        required: false
        default: false
        type: boolean
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    runs-on: ubuntu-24.04
    outputs:
      desktop_linux: ${{ steps.changes.outputs.desktop_linux }}
      desktop_windows: ${{ steps.changes.outputs.desktop_windows }}
      fixtures: ${{ steps.changes.outputs.fixtures }}
      windows_zip: ${{ steps.changes.outputs.windows_zip }}
      webdav_test_kit: ${{ steps.changes.outputs.webdav_test_kit }}
      desktop_cache_validation: ${{ steps.changes.outputs.desktop_cache_validation }}
      source_sha: ${{ steps.changes.outputs.source_sha }}
      reason: ${{ steps.changes.outputs.reason }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Select Desktop checks (fail closed)
        id: changes
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_BEFORE: ${{ github.event.before }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CI_SOURCE_REF: ${{ inputs.source_ref }}
          CI_FULL_TESTS: ${{ inputs.full_tests }}
          CI_WINDOWS_ZIP: ${{ inputs.windows_zip }}
          CI_WEBDAV_KIT: ${{ inputs.webdav_test_kit }}
          CI_RELEASE: ${{ github.event_name == 'release' }}
        run: python3 scripts/classify-ci-changes.py

  documentation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.sha }}
          persist-credentials: false
      - name: Проверить документы и пробелы в изменениях
        run: |
          python3 scripts/check_repository.py

  fixtures:
    needs: classify
    if: needs.classify.outputs.fixtures == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.sha }}
          persist-credentials: false
      - name: Установить FFmpeg и создать законные синтетические образцы
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python3 scripts/generate-audio-fixtures.py build/audio-fixtures
          python3 scripts/generate-audio-fixtures.py build/audio-fixtures --verify-only
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: synthetic-audio-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/audio-fixtures/
          if-no-files-found: error
          retention-days: 1

  linux:
    needs: [classify, fixtures]
    if: needs.classify.outputs.desktop_linux == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/workflows/desktop.yml
      - name: Установить системные зависимости Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-13 libpulse0 libasound2t64 libgl1-mesa-dev libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 xvfb xauth fonts-dejavu-core
          echo 'CC=gcc-13' >> "$GITHUB_ENV"
          echo 'CXX=g++-13' >> "$GITHUB_ENV"
      - name: Установить CMake 3.30.5
        run: python -m pip install cmake==3.30.5
      - name: Восстановить кэш Ninja 1.12.1
        id: ninja_cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: build/ninja-cache/
          key: ninja-1.12.1-${{ runner.os }}-${{ runner.arch }}-gcc13-2daa09ba270b0a43e1929d29b073348aa985dfaa-v1-${{ hashFiles('.github/workflows/desktop.yml') }}
      - name: Собрать Ninja при отсутствии кэша
        if: steps.ninja_cache.outputs.cache-hit != 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ninja-build/ninja
          ref: 2daa09ba270b0a43e1929d29b073348aa985dfaa
          path: build/ninja-source
          persist-credentials: false
      - name: Проверить или собрать Ninja
        run: |
          mkdir -p build/ninja-cache
          if [[ "${{ steps.ninja_cache.outputs.cache-hit }}" != "true" ]]; then
            cd build/ninja-source
            python configure.py --bootstrap
            cp ninja "$GITHUB_WORKSPACE/build/ninja-cache/ninja"
            cd "$GITHUB_WORKSPACE"
          fi
          chmod +x build/ninja-cache/ninja
          echo "$GITHUB_WORKSPACE/build/ninja-cache" >> "$GITHUB_PATH"
          test "$(build/ninja-cache/ninja --version)" = '1.12.1'
      - name: Установить Qt 6.12.0 с кэшем
        id: qt
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          version: '6.12.0'
          arch: linux_gcc_64
          modules: 'qtmultimedia qtshadertools'
          cache: true
          cache-key-prefix: allmusic-desktop-qt6120-aqt330-modules-multimedia-shadertools-v1
          aqtversion: '==3.3.0'
          extra: '--base https://download.qt.io'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.1.8
        with:
          name: synthetic-audio-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/audio-fixtures
      - name: Проверить версии и собрать Desktop
        run: |
          cmake --version
          ninja --version
          qmake -query QT_VERSION
          g++-13 --version
          cmake --preset desktop-release
          cmake --build --preset desktop-release --parallel 2
      - name: Выполнить тесты Desktop в виртуальном X11
        run: xvfb-run -a ctest --preset desktop-release --verbose
        env:
          QT_QPA_PLATFORM: xcb
      - name: Показать отчёт QtTest
        if: always()
        run: |
          if [ -f build/desktop-release/streaming-test-results.txt ]; then
            cat build/desktop-release/streaming-test-results.txt
          fi
      - name: Сохранить диагностику при ошибке
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: diagnostics-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/desktop-release/Testing/Temporary/
          if-no-files-found: ignore
          retention-days: 3

  windows:
    needs: [classify, fixtures]
    if: needs.classify.outputs.desktop_windows == 'true'
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/workflows/desktop.yml
      - name: Подготовить MSVC 2022 x64
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64
          toolset: '14.44'
      - name: Установить CMake 3.30.5
        run: python -m pip install cmake==3.30.5
      - name: Восстановить кэш Ninja 1.12.1
        id: ninja_cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: build/ninja-cache/
          key: ninja-1.12.1-${{ runner.os }}-${{ runner.arch }}-msvc14.44-2daa09ba270b0a43e1929d29b073348aa985dfaa-v1-${{ hashFiles('.github/workflows/desktop.yml') }}
      - name: Получить исходники Ninja при отсутствии кэша
        if: steps.ninja_cache.outputs.cache-hit != 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ninja-build/ninja
          ref: 2daa09ba270b0a43e1929d29b073348aa985dfaa
          path: build/ninja-source
          persist-credentials: false
      - name: Проверить или собрать Ninja
        run: |
          mkdir -p build/ninja-cache
          if [[ "${{ steps.ninja_cache.outputs.cache-hit }}" != "true" ]]; then
            cd build/ninja-source
            python configure.py --bootstrap
            cp ninja.exe "$GITHUB_WORKSPACE/build/ninja-cache/ninja.exe"
            cd "$GITHUB_WORKSPACE"
          fi
          echo "$GITHUB_WORKSPACE/build/ninja-cache" >> "$GITHUB_PATH"
          test "$(build/ninja-cache/ninja.exe --version)" = '1.12.1'
      - name: Установить Qt 6.12.0 с кэшем
        id: qt
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          version: '6.12.0'
          arch: win64_msvc2022_64
          modules: 'qtmultimedia qtshadertools'
          cache: true
          cache-key-prefix: allmusic-desktop-qt6120-aqt330-aqtfix076e165-modules-multimedia-shadertools-v1
          aqtversion: '==3.3.0'
          # aqt 3.3.0 does not support the Qt >=6.11 Windows repository layout.
          aqtsource: git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7
          extra: '--base https://download.qt.io'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.1.8
        with:
          name: synthetic-audio-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/audio-fixtures
      - name: Проверить версии и собрать Desktop
        run: |
          cmake --version
          ninja.exe --version
          qmake -query QT_VERSION
          cl 2>&1 || true
          cmake --preset desktop-release
          cmake --build --preset desktop-release --parallel 2
      - name: Выполнить тесты Desktop на Windows Server
        run: ctest --preset desktop-release --verbose
      - name: Получить источники Qt для лицензий Windows ZIP
        if: needs.classify.outputs.windows_zip == 'true' || needs.classify.outputs.webdav_test_kit == 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: qt/qtbase
          ref: 025bdad181de241e81bf853c8a2d7bf3d19261a9
          path: build/license-sources/qtbase
          persist-credentials: false
      - name: Получить исходники Qt Declarative для лицензий
        if: needs.classify.outputs.windows_zip == 'true' || needs.classify.outputs.webdav_test_kit == 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: qt/qtdeclarative
          ref: 4332fbbb4c340463dc8cee36dda0c85d932122d8
          path: build/license-sources/qtdeclarative
          persist-credentials: false
      - name: Получить исходники Qt Multimedia для лицензий Windows ZIP
        if: needs.classify.outputs.windows_zip == 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: qt/qtmultimedia
          ref: 6ca885f084a3984749d53bb50a0e08bdc60e86cc
          path: build/license-sources/qtmultimedia
          persist-credentials: false
      - name: Получить скрипты сборки Qt FFmpeg
        if: needs.classify.outputs.windows_zip == 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: qt/qt5
          ref: ef25002ed292b132d1ed3246bfcee1d24a9cd966
          path: build/license-sources/qt5
          sparse-checkout: coin/provisioning
          persist-credentials: false
      - name: Получить соответствующие исходники FFmpeg
        if: needs.classify.outputs.windows_zip == 'true'
        shell: pwsh
        run: ./scripts/collect-ffmpeg.ps1
      - name: Проверить комплект и собрать Windows ZIP
        if: needs.classify.outputs.windows_zip == 'true'
        shell: pwsh
        run: ./scripts/package-windows.ps1
      - name: Проверить комплект и собрать WebDAV test kit
        if: needs.classify.outputs.webdav_test_kit == 'true'
        shell: pwsh
        run: ./scripts/package-webdav.ps1
      - name: Записать SHA исходного кода в отчёт запуска
        if: always()
        shell: bash
        run: |
          echo "Исходный commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "Ветка/событие: $GITHUB_REF_NAME / $GITHUB_EVENT_NAME" >> "$GITHUB_STEP_SUMMARY"
      - name: Сохранить Windows ZIP по запросу или для релиза
        if: (github.event_name == 'release') || (github.event_name == 'workflow_dispatch' && inputs.windows_zip)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: AllMusicPlayer-Windows-x64-${{ github.run_id }}
          path: dist/AllMusicPlayer-Windows-x64.zip
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'release' && 90 || 14 }}
      - name: Сохранить WebDAV test kit по запросу или для релиза
        if: (github.event_name == 'release') || (github.event_name == 'workflow_dispatch' && inputs.webdav_test_kit)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: WebDav001A-Windows-x64-${{ github.run_id }}
          path: dist/WebDav001A-Windows-x64.zip
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'release' && 90 || 14 }}
      - name: Сохранить диагностику при ошибке
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: diagnostics-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/desktop-release/Testing/Temporary/
            build/ffmpeg-info.json
            build/package-smoke.png
            build/packaged-playback.txt
            build/packaged-streaming.txt
          if-no-files-found: ignore
          retention-days: 3

  ci-result:
    name: Desktop CI result
    if: always()
    needs: [classify, documentation, fixtures, linux, windows, warm_cache]
    runs-on: ubuntu-24.04
    steps:
      - name: Проверить обязательные статусы
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          DOCUMENTATION_RESULT: ${{ needs.documentation.result }}
          FIXTURES_RESULT: ${{ needs.fixtures.result }}
          LINUX_RESULT: ${{ needs.linux.result }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
          CACHE_RESULT: ${{ needs.warm_cache.result }}
          EXPECT_FIXTURES: ${{ needs.classify.outputs.fixtures }}
          EXPECT_LINUX: ${{ needs.classify.outputs.desktop_linux }}
          EXPECT_WINDOWS: ${{ needs.classify.outputs.desktop_windows }}
          EXPECT_CACHE: ${{ needs.classify.outputs.desktop_cache_validation }}
          CHANGE_REASON: ${{ needs.classify.outputs.reason }}
          SOURCE_SHA: ${{ needs.classify.outputs.source_sha }}
        run: |
          python3 - <<'PY'
          import os
          import sys

          failures = []
          for name in ("CLASSIFY", "DOCUMENTATION"):
              if os.environ[f"{name}_RESULT"] != "success":
                  failures.append(f"{name}: {os.environ[f'{name}_RESULT']}")
          for job, expected in (("FIXTURES", "EXPECT_FIXTURES"), ("LINUX", "EXPECT_LINUX"), ("WINDOWS", "EXPECT_WINDOWS")):
              result = os.environ[f"{job}_RESULT"]
              should_run = os.environ[expected] == "true"
              if should_run and result != "success":
                  failures.append(f"{job}: expected success, got {result}")
              if not should_run and result not in {"success", "skipped"}:
                  failures.append(f"{job}: unexpected {result}")
          cache_expected = os.environ["EXPECT_CACHE"] == "true"
          cache_result = os.environ["CACHE_RESULT"]
          platforms_succeeded = (
              os.environ["EXPECT_LINUX"] == "true"
              and os.environ["LINUX_RESULT"] == "success"
              and os.environ["EXPECT_WINDOWS"] == "true"
              and os.environ["WINDOWS_RESULT"] == "success"
          )
          if cache_expected and platforms_succeeded and cache_result != "success":
              failures.append(f"CACHE: expected warm-cache verification, got {cache_result}")
          if (not cache_expected or not platforms_succeeded) and cache_result not in {"success", "skipped"}:
              failures.append(f"CACHE: unexpected {cache_result}")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(f"Изменения: {os.environ['CHANGE_REASON']}\n\nИсходный commit: `{os.environ['SOURCE_SHA']}`\n")
          if failures:
              print("\n".join(failures), file=sys.stderr)
              raise SystemExit(1)
          print("Все ожидаемые проверки завершились успешно; пропущены только классифицированные платформы.")
          PY

  warm_cache:
    if: always() && needs.classify.result == 'success' && needs.classify.outputs.desktop_cache_validation == 'true' && needs.linux.result == 'success' && needs.windows.result == 'success'
    needs: [classify, linux, windows]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            qt-arch: linux_gcc_64
            prefix: allmusic-desktop-qt6120-aqt330-modules-multimedia-shadertools-v1
            ninja-key: ninja-1.12.1-Linux-X64-gcc13-2daa09ba270b0a43e1929d29b073348aa985dfaa-v1
            aqtsource: ''
          - os: windows-2022
            qt-arch: win64_msvc2022_64
            prefix: allmusic-desktop-qt6120-aqt330-aqtfix076e165-modules-multimedia-shadertools-v1
            ninja-key: ninja-1.12.1-Windows-X64-msvc14.44-2daa09ba270b0a43e1929d29b073348aa985dfaa-v1
            aqtsource: git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.sha }}
          persist-credentials: false
      - name: Проверить тёплый кэш Ninja
        id: ninja_cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: build/ninja-cache/
          key: ${{ matrix.ninja-key }}-${{ hashFiles('.github/workflows/desktop.yml') }}
      - name: Убедиться, что Ninja восстановлен
        run: |
          mkdir -p build/ninja-cache
          test "${{ steps.ninja_cache.outputs.cache-hit }}" = 'true'
          if [ "$RUNNER_OS" = 'Windows' ]; then
            test "$(build/ninja-cache/ninja.exe --version)" = '1.12.1'
          else
            test "$(build/ninja-cache/ninja --version)" = '1.12.1'
          fi
      - name: Восстановить кэш Qt через install-qt-action
        id: qt-warm
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          version: '6.12.0'
          arch: ${{ matrix.qt-arch }}
          modules: 'qtmultimedia qtshadertools'
          cache: true
          cache-key-prefix: ${{ matrix.prefix }}
          aqtversion: '==3.3.0'
          aqtsource: ${{ matrix.aqtsource }}
          extra: '--base https://download.qt.io'
      - name: Проверить Qt и записать признак cache hit в лог запуска
        run: |
          test "$(qmake -query QT_VERSION)" = '6.12.0'
          if [ "$RUNNER_OS" = 'Windows' ]; then
            build/ninja-cache/ninja.exe --version
          else
            build/ninja-cache/ninja --version
          fi
          echo "Тёплый кэш Qt проверен; в предыдущем шаге ищите строку Automatic cache hit." >> "$GITHUB_STEP_SUMMARY"
