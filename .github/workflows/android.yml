name: Android 001-C

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/android.yml'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'src/app/**'
      - 'ui/android/**'
      - 'android/**'
      - 'scripts/*android*'
      - 'scripts/collect-licenses.py'
      - 'tests/android/**'
      - 'docs/ANDROID-TEST.md'
      - 'docs/DEPENDENCIES.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-001c-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      # No shared Gradle cache: do not persist temporary debug signing material.
      GRADLE_USER_HOME: ${{ github.workspace }}/build/gradle-home
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Prepare JDK 21 and check documents
        run: |
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
          python3 scripts/check_repository.py
          python3 -m unittest discover -s tests/android -v
          git diff --check
      - name: Prepare Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          cmdline-tools-version: '12266719'
          log-accepted-android-sdk-licenses: false
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.2.12479018'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
      - name: Install open-source Qt 6.12.0 Android and host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon0 libxcb-cursor0
          python -m pip install 'git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7'
          mkdir -p build/android-evidence
          # Qt >=6.7 Android metadata lives in all_os; install-qt resolves it.
          # Avoid install-qt-action's linux/android version-list preflight.
          python -m aqt list-qt all_os android --arch 6.12.0 > build/android-evidence/available-qt-abis.txt
          # Keep Qt outside the source tree: qmlimportscanner scans project roots.
          # Host tools require Qt's ICU archive; ICU is not Android runtime.
          python -m aqt install-qt linux desktop 6.12.0 linux_gcc_64 --archives qtbase qtdeclarative icu --outputdir "$RUNNER_TEMP/Qt" --base https://download.qt.io
          python -m aqt install-qt linux android 6.12.0 android_arm64_v8a --archives qtbase qtdeclarative --outputdir "$RUNNER_TEMP/Qt" --base https://download.qt.io
      - name: CMake 3.30.5
        run: python -m pip install cmake==3.30.5
      - name: Get Ninja 1.12.1 sources
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ninja-build/ninja
          ref: 2daa09ba270b0a43e1929d29b073348aa985dfaa
          path: build/ninja-source
          persist-credentials: false
      - name: Build Ninja and identify experiment
        run: |
          cd build/ninja-source
          python configure.py --bootstrap
          echo "$PWD" >> "$GITHUB_PATH"
      - name: Configure and build bundled debug APK
        env:
          QT_ANDROID_ROOT: ${{ runner.temp }}/Qt/6.12.0/android_arm64_v8a
          QT_HOST_PATH: ${{ runner.temp }}/Qt/6.12.0/gcc_64
        run: |
          mkdir -p build/android-evidence
          short_sha=$(git rev-parse --short=12 HEAD)
          label="001-C-${short_sha}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "BUILD_LABEL=$label" >> "$GITHUB_ENV"
          echo "ARTIFACT_NAME=AllMusicPlayer-001C-Android-arm64-v8a-debug-${short_sha}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
          { java -version; cmake --version; ninja --version; "$QT_ANDROID_ROOT/bin/qmake" -query QT_VERSION; cat "$ANDROID_HOME/ndk/27.2.12479018/source.properties"; } > build/android-evidence/toolchain.txt 2>&1
          cmake --preset android-debug -DALLMUSIC_BUILD_LABEL="$label" -DALLMUSIC_ANDROID_VERSION_CODE="$GITHUB_RUN_NUMBER"
          cat build/android-debug/src/app/android-allmusic-player-deployment-settings.json > build/android-evidence/deployment-settings.json
          cmake --build --preset android-debug --parallel 2
      - name: Audit runtime dependencies
        run: |
          cd build/android-debug/src/app/android-build
          ./gradlew --no-daemon --console=plain dependencies --configuration debugRuntimeClasspath > "$GITHUB_WORKSPACE/build/android-evidence/gradle-runtime.txt"
      - name: Collect Qt Base license sources
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: qt/qtbase
          ref: 025bdad181de241e81bf853c8a2d7bf3d19261a9
          path: build/license-sources/qtbase
          persist-credentials: false
      - name: Collect Qt Declarative license sources
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: qt/qtdeclarative
          ref: 4332fbbb4c340463dc8cee36dda0c85d932122d8
          path: build/license-sources/qtdeclarative
          persist-credentials: false
      - name: Verify and package APK
        run: python scripts/package-android.py
      - name: Upload installable test kit
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: dist/android/
          if-no-files-found: error
          retention-days: 14
      - name: Upload audit diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Android-001C-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/android-evidence/
          if-no-files-found: ignore
          retention-days: 14

